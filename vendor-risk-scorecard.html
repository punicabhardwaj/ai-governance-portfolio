const OPTIONS = [
  { value: 3, label: "Yes - fully documented", color: "#10b981" },
  { value: 2, label: "Partially / in progress", color: "#eab308" },

// ============================================================
// SCORING ENGINE
// ============================================================
function computeScore(domainScores) {
  const domainResults = DOMAINS.map(d => {
    const qs = d.questions.map(q => domainScores[d.id]?.[q.id] ?? null);
    const answered = qs.filter(v => v !== null);
    const raw = answered.length > 0 ? answered.reduce((a,b)=>a+b,0) : 0;
    const maxRaw = answered.length * 3;
    const pct = maxRaw > 0 ? (raw / maxRaw) * 100 : 0;
    return { ...d, raw, maxRaw, pct, answered: answered.length, scores: qs };
  });

  const totalWeighted = domainResults.reduce((sum, d) => sum + (d.pct * d.weight / 100), 0);
  const maxPossible = domainResults.reduce((sum,d)=>sum+d.weight,0);
  const overallPct = totalWeighted;

  let tier, tierColor, recommendation;
  if (overallPct >= 80) {
    tier = "Low Risk - Approved"; tierColor = "#10b981";
    recommendation = "Vendor meets governance standards. Proceed with standard contractual review and annual re-assessment.";
  } else if (overallPct >= 60) {
    tier = "Medium Risk - Conditional"; tierColor = "#eab308";
    recommendation = "Vendor approved with conditions. Address gaps in underscoring domains before full deployment. Schedule 90-day follow-up review.";
  } else if (overallPct >= 40) {
    tier = "High Risk - Requires Remediation"; tierColor = "#f97316";
    recommendation = "Significant governance gaps identified. Vendor must address flagged items before procurement can proceed. Escalate to legal and compliance.";
  } else {
    tier = "Critical Risk - Do Not Proceed"; tierColor = "#ef4444";
    recommendation = "Vendor fails minimum governance thresholds. Do not proceed with procurement. Consider alternative vendors or require substantial remediation.";
  }

  // Gap analysis
  const gaps = domainResults
    .filter(d => d.pct < 67)
    .map(d => `${d.name} (${Math.round(d.pct)}%) - requires attention`);

  return { domainResults, overallPct: Math.round(overallPct), tier, tierColor, recommendation, gaps };
}

// ============================================================

function DomainCard({ domain, scores, onScore }) {
  const answered = domain.questions.filter(q => scores[domain.id]?.[q.id] !== undefined).length;
  const total = domain.questions.length;
  const pct = answered / total;

  return (
    <div className="domain-card">
      <div className="domain-head">
        <span className="domain-icon">{domain.icon}</span>
        <span className="domain-name">{domain.name}</span>
        <span className="domain-weight">{domain.weight}% weight</span>
      </div>
      <div className="domain-desc">{domain.description}</div>

      {domain.questions.map(q => {
        const val = scores[domain.id]?.[q.id];
        return (
          <div key={q.id} className="question-item">
            <div className="question-text">{q.text}</div>
            <div className="options-row">
              {OPTIONS.map(opt => (
                <button
                  key={opt.value}
                  className={`opt-btn${val===opt.value?` selected-${opt.value}`:""}`}
                  onClick={() => onScore(domain.id, q.id, opt.value)}
                >
                  {opt.label}
                </button>
              ))}
            </div>
          </div>
        );
      })}

      <div className="progress-mini">
        <div className="progress-mini-fill" style={{ width:`${pct*100}%`, background: pct===1?"#10b981":"#38bdf8" }}/>
      </div>
      <div style={{fontSize:11,color:'#475569',marginTop:4,fontFamily:'Space Mono,monospace'}}>{answered}/{total} ANSWERED</div>
    </div>
  );
}

function Results({ result, vendorName, vendorType, useCase, onReset }) {

  const barColor = d => d.pct >= 80 ? "#10b981" : d.pct >= 60 ? "#eab308" : d.pct >= 40 ? "#f97316" : "#ef4444";
  const dotColor = v => v===3?"#10b981":v===2?"#eab308":v===1?"#f97316":"#ef4444";

  return (
    <div>
      <div className="score-hero">
        <div className="score-label">Overall Vendor Risk Score</div>
        <div className="score-number" style={{color:tierColor}}>{overallPct}<span style={{fontSize:28,color:'#64748b'}}>/100</span></div>
        <div className="tier-badge" style={{background:`${tierColor}20`,border:`1px solid ${tierColor}`,color:tierColor}}>{tier}</div>
        <div style={{fontSize:13,color:'#64748b',marginBottom:8}}>{vendorName} · {vendorType}</div>
        <div className="recommendation-text">{recommendation}</div>
      </div>

      <div className="card" style={{marginBottom:20}}>
        <div className="sec-label">Vendor Details</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'12px 24px'}}>
          {[["Vendor",vendorName],["Type",vendorType],["Use Case",useCase]].map(([k,v])=>(
            <div key={k}>
              <div style={{fontFamily:'Space Mono,monospace',fontSize:10,color:'#64748b',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:3}}>{k}</div>
              <div style={{fontSize:13,color:'#cbd5e1'}}>{v}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="sec-label">Domain Scores</div>
      <div className="domain-result-grid" style={{marginBottom:24}}>
        {domainResults.map(d => (
          <div key={d.id} className="domain-result-card">
            <div className="domain-result-head">
              <span style={{fontSize:16}}>{d.icon}</span>
              <span className="domain-result-name">{d.name}</span>
              <span className="domain-pct" style={{color:barColor(d)}}>{Math.round(d.pct)}%</span>
              <span style={{fontFamily:'Space Mono,monospace',fontSize:10,color:'#475569',marginLeft:4}}>(weight: {d.weight}%)</span>
            </div>
            <div className="bar-bg">
              <div className="bar-fill" style={{width:`${d.pct}%`,background:barColor(d)}}/>
            </div>
            <div className="domain-answers">
              {d.scores.map((s,i) => (
                <div key={i} className="ans-dot" style={{background:s!==null?dotColor(s):"#1e2d42"}} title={OPTIONS.find(o=>o.value===s)?.label||"Not answered"}/>
              ))}

      </div>

      {gaps.length > 0 && (
        <div className="card" style={{marginBottom:20}}>
          <div className="sec-label">Gap Analysis</div>
          <div className="gap-list">
            {gaps.map((g,i)=>(
              <div key={i} className="gap-item"><span className="gap-dot"/>{g}</div>
            ))}
          </div>
        </div>
      )}

      <div className="card" style={{marginBottom:20}}>
        <div className="sec-label">NIST AI RMF · Govern Function Mapping</div>
        <div className="nist-grid">
          <div className="nist-card">
            <div className="nist-id">GOVERN 1.1</div>
            <div className="nist-text">Third-party AI policies and expectations are documented. Vendor assessed against organizational risk tolerance.</div>
          </div>
          <div className="nist-card">
            <div className="nist-id">GOVERN 1.4</div>
            <div className="nist-text">Organizational roles and responsibilities for AI risk management are defined, including vendor oversight.</div>
          </div>
          <div className="nist-card">
            <div className="nist-id">GOVERN 6.1</div>
            <div className="nist-text">AI risks from third-party relationships are identified, assessed, and monitored through structured vendor review.</div>
          </div>
          <div className="nist-card">
            <div className="nist-id">GOVERN 6.2</div>
            <div className="nist-text">Contractual protections and audit rights are assessed for their adequacy in managing third-party AI risk.</div>
          </div>
        </div>
      </div>

      <div className="btn-row">
        <button className="btn btn-download" onClick={()=>window.print()}>↓ Download Scorecard (PDF)</button>
        <button className="btn btn-secondary" onClick={onReset}>Assess Another Vendor</button>
      </div>
    </div>
  );
}

function App() {
  const [mode, setMode] = useState("form");
  const [vendorName, setVendorName] = useState("");
  const [vendorType, setVendorType] = useState("");
  const [useCase, setUseCase] = useState("");
  const [scores, setScores] = useState({});
  const [result, setResult] = useState(null);

  const handleScore = (domainId, questionId, value) => {
    setScores(s => ({ ...s, [domainId]: { ...s[domainId], [questionId]: value } }));
  };

  const loadPreset = (key) => {
    const v = VENDORS[key];
    setVendorName(v.name);
    setVendorType(v.type);
    setUseCase(v.use_case);
    setScores(v.scores);
  };

  const totalQs = DOMAINS.reduce((s,d)=>s+d.questions.length,0);
  const answeredQs = DOMAINS.reduce((s,d)=>s+d.questions.filter(q=>scores[d.id]?.[q.id]!==undefined).length,0);
  const canSubmit = vendorName && vendorType && useCase && answeredQs === totalQs;
  const progressPct = Math.round((answeredQs / totalQs) * 100);

  const runScorecard = () => {
    const r = computeScore(scores);
    setResult(r);
    setMode("results");
  };

  const reset = () => {
    setMode("form"); setVendorName(""); setVendorType(""); setUseCase(""); setScores({}); setResult(null);
  };

  return (
    <>
      <style>{css}</style>
      <div className="vrs-root">
        <header className="vrs-header">
          <div className="vrs-logo">AI<span>/</span>Gov · Vendor Risk</div>
          <div className="vrs-badge">PROTOTYPE v0.1</div>
        </header>

        <div className="vrs-body">
          <div className="vrs-title">AI Vendor Risk Scorecard</div>
          <div className="vrs-subtitle">
            Assess third-party AI vendors against six governance domains: model transparency, data governance, security, regulatory compliance, incident response, and contractual protections. Mapped to NIST AI RMF Govern function.
          </div>

          {mode === "form" && (
            <>
              <div className="demo-bar">
                <span className="demo-label">Quick Demo:</span>
                <button className="demo-chip" onClick={()=>loadPreset("openai")}>OpenAI · Medium Risk</button>
                <button className="demo-chip" onClick={()=>loadPreset("smallvendor")}>Acme AI Startup · High Risk</button>
                <button className="demo-chip" onClick={()=>loadPreset("enterprise")}>IBM Watson · Low Risk</button>
              </div>

              <div className="card">
                <div className="sec-label">Vendor Information</div>
                <div className="two-col">
                  <div className="field-group">
                    <label className="field-label">Vendor Name</label>
                    <input className="field-input" placeholder="e.g. OpenAI, Salesforce Einstein, Workday AI" value={vendorName} onChange={e=>setVendorName(e.target.value)}/>
                  </div>
                  <div className="field-group">
                    <label className="field-label">Vendor Type</label>
                    <input className="field-input" placeholder="e.g. Foundation Model Provider, SaaS AI Application" value={vendorType} onChange={e=>setVendorType(e.target.value)}/>
                  </div>
                </div>
                <div className="field-group">
                  <label className="field-label">Intended Use Case</label>
                  <input className="field-input" placeholder="e.g. Customer-facing chatbot, Internal HR automation, Credit decisioning" value={useCase} onChange={e=>setUseCase(e.target.value)}/>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:10,marginTop:4}}>
                  <div style={{flex:1,height:4,background:'#1e2d42',borderRadius:2,overflow:'hidden'}}>
                    <div style={{height:'100%',background:progressPct===100?"#10b981":"#38bdf8",width:`${progressPct}%`,borderRadius:2,transition:'width .3s'}}/>
                  </div>
                  <div style={{fontFamily:'Space Mono,monospace',fontSize:10,color:'#475569',whiteSpace:'nowrap'}}>{answeredQs}/{totalQs} QUESTIONS</div>
                </div>
              </div>

              {DOMAINS.map(d => (
                <DomainCard key={d.id} domain={d} scores={scores} onScore={handleScore}/>
              ))}

              <div className="btn-row">
                <button className="btn btn-primary" onClick={runScorecard} disabled={!canSubmit}>
                  {canSubmit ? "Generate Scorecard" : `Answer all ${totalQs - answeredQs} remaining questions`}
                </button>
              </div>
            </>
          )}

          {mode === "results" && result && (
            <Results result={result} vendorName={vendorName} vendorType={vendorType} useCase={useCase} onReset={reset}/>
          )}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
