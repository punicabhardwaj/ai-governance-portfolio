// ============================================================
// FAIRNESS METRIC ENGINE
// ============================================================
function computeFairness(groups, attribute) {
  const names = Object.keys(groups);

  // Per-group rates
  const groupStats = names.map(name => {
    const g = groups[name];
    const selection_rate = g.positive_pred / g.total;
    const tpr = g.actual_positive > 0 ? g.true_positive / g.actual_positive : 0;
    const fpr = (g.total - g.actual_positive) > 0
      ? (g.positive_pred - g.true_positive) / (g.total - g.actual_positive)
      : 0;
    const precision = g.positive_pred > 0 ? g.true_positive / g.positive_pred : 0;
    return { name, ...g, selection_rate, tpr, fpr, precision };
  });

  // Reference = highest selection rate group
  const ref = groupStats.reduce((a,b) => a.selection_rate > b.selection_rate ? a : b);

  // Metric computations
  const results = groupStats.map(g => {
    const dir = g.selection_rate > 0 ? ref.selection_rate / g.selection_rate : Infinity;
    const dpd = g.selection_rate - ref.selection_rate;
    const eod = g.tpr - ref.tpr;
    return { ...g, disparate_impact_ratio: g === ref ? 1.0 : g.selection_rate / ref.selection_rate, demographic_parity_diff: dpd, equal_opportunity_diff: eod };
  });

  // Overall flags
  const minDIR = Math.min(...results.filter(r => r.name !== ref.name).map(r => r.disparate_impact_ratio));
  const maxDPD = Math.max(...results.map(r => Math.abs(r.demographic_parity_diff)));
  const maxEOD = Math.max(...results.map(r => Math.abs(r.equal_opportunity_diff)));

  const dirFail = minDIR < 0.8;
  const dpdFail = maxDPD > 0.1;
  const eodFail = maxEOD > 0.1;

  const overallPass = !dirFail && !dpdFail && !eodFail;
  const risk = dirFail && dpdFail && eodFail ? "High" : (dirFail || dpdFail || eodFail) ? "Medium" : "Low";

  // Recommendations
  const recs = [];
  if (dirFail) recs.push("Apply re-sampling or re-weighting techniques to address under-representation in training data for disadvantaged groups.");
  if (dpdFail) recs.push("Adjust classification thresholds per group to achieve demographic parity, or apply fairness constraints during model training.");
  if (eodFail) recs.push("Implement equalized odds post-processing to align true positive rates across groups.");
  if (dirFail) recs.push("Conduct a DPIA focused on disparate impact before deploying this model in any hiring, lending, or benefits context.");
  recs.push("Document all fairness metric results and remediation actions in the model card for audit purposes (NIST AI RMF - MEASURE 2.5).");
  if (risk === "High") recs.push("Escalate to AI Ethics Review Board before production deployment. Consider pausing until disparate impact is below the 0.80 threshold.");

  return { groupStats: results, ref, minDIR, maxDPD, maxEOD, dirFail, dpdFail, eodFail, overallPass, risk, recs, attribute };
}

// ============================================================
// CSV PARSER
// ============================================================
function parseCSV(text, attributeCol, predictionCol, outcomeCol) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
  const attrIdx = headers.indexOf(attributeCol);
  const predIdx = headers.indexOf(predictionCol);
  const outIdx = headers.indexOf(outcomeCol);
  if (attrIdx<0||predIdx<0||outIdx<0) throw new Error(`Column not found. Available: ${headers.join(', ')}`);

  const groups = {};
  for (let i=1;i<lines.length;i++) {
    const row = lines[i].split(',').map(c=>c.trim().replace(/"/g,''));
    if (row.length < headers.length) continue;
    const grp = row[attrIdx];
    const pred = parseInt(row[predIdx]);
    const actual = parseInt(row[outIdx]);
    if (!groups[grp]) groups[grp] = { total:0, positive_pred:0, actual_positive:0, true_positive:0 };
    groups[grp].total++;
    if (pred===1) groups[grp].positive_pred++;
    if (actual===1) groups[grp].actual_positive++;
    if (pred===1&&actual===1) groups[grp].true_positive++;
  }
  if (Object.keys(groups).length < 2) throw new Error("Need at least 2 groups in the attribute column.");
  return groups;
}

// ============================================================
// COMPONENTS
// ============================================================
function MetricCard({ name, value, pass, threshold, barPct, desc }) {
  const cls = pass === true ? "metric-pass" : pass === false ? "metric-fail" : "metric-warn";
  const barColor = pass === true ? "#10b981" : pass === false ? "#ef4444" : "#f97316";
  return (
    <div className="metric-card">
      <div className="metric-name">{name}</div>
      <div className={`metric-value ${cls}`}>{value}</div>
      <div className="metric-threshold">{threshold}</div>
      <div className="metric-bar-bg">
        <div className="metric-bar-fill" style={{ width: `${Math.min(barPct,100)}%`, background: barColor }} />
      </div>
      <div className="metric-desc">{desc}</div>
    </div>
  );
}

function Results({ result, onReset }) {
  const { groupStats, ref, minDIR, maxDPD, maxEOD, dirFail, dpdFail, eodFail, overallPass, risk, recs, attribute } = result;

  const verdictClass = overallPass ? "verdict-pass" : risk === "High" ? "verdict-fail" : "verdict-warn";
  const verdictIcon = overallPass ? "✅" : risk === "High" ? "🚨" : "⚠️";
  const verdictTitle = overallPass ? "Fairness Thresholds Met" : risk === "High" ? "Significant Bias Detected" : "Potential Bias Detected";
  const verdictSub = overallPass
    ? "All three fairness metrics are within acceptable thresholds. Document these results in the model card."
    : `${[dirFail?"Disparate Impact":null,dpdFail?"Demographic Parity":null,eodFail?"Equal Opportunity":null].filter(Boolean).join(", ")} ${[dirFail,dpdFail,eodFail].filter(Boolean).length>1?"metrics fail":"metric fails"} industry thresholds. Remediation required before deployment in high-stakes contexts.`;

  const pct = v => `${(v*100).toFixed(1)}%`;

  return (
    <div>
      <div className={`verdict-banner ${verdictClass}`}>
        <span className="verdict-icon">{verdictIcon}</span>
        <div>
          <div className="verdict-title">{verdictTitle} · {risk} Risk</div>
          <div className="verdict-sub">{verdictSub}</div>
        </div>
      </div>

      <div className="result-section-title">Fairness Metrics Summary</div>
      <div className="metrics-grid" style={{marginBottom:24}}>
        <MetricCard
          name="Disparate Impact Ratio"
          value={minDIR.toFixed(3)}
          pass={!dirFail}
          threshold={`Threshold: ≥ 0.800 · ${dirFail?"FAIL":"PASS"}`}
          barPct={minDIR*100}
          desc="Ratio of selection rates between least and most favored group. Below 0.8 is the 4/5ths Rule (EEOC standard)."
        />
        <MetricCard
          name="Demographic Parity Diff"
          value={maxDPD.toFixed(3)}
          pass={!dpdFail}
          threshold={`Threshold: ≤ 0.100 · ${dpdFail?"FAIL":"PASS"}`}
          barPct={maxDPD*100*5}
          desc="Maximum difference in positive prediction rates across groups. Equal selection rates regardless of group membership."
        />
        <MetricCard
          name="Equal Opportunity Diff"
          value={maxEOD.toFixed(3)}
          pass={!eodFail}
          threshold={`Threshold: ≤ 0.100 · ${eodFail?"FAIL":"PASS"}`}
          barPct={maxEOD*100*5}
          desc="Maximum difference in true positive rates across groups. Equal recall for qualified individuals regardless of group."
        />
      </div>

      <div className="card" style={{marginBottom:20}}>
        <div className="result-section-title">Group-Level Breakdown · Protected Attribute: {attribute}</div>
        <div style={{overflowX:'auto'}}>
          <table className="group-table">
            <thead>
              <tr>
                <th>Group</th>
                <th>N</th>
                <th>Selection Rate</th>
                <th>True Positive Rate</th>
                <th>Precision</th>
                <th>DIR vs Reference</th>
                <th>Parity Diff</th>
              </tr>
            </thead>
            <tbody>
              {groupStats.map(g => (
                <tr key={g.name} className={g.name===ref.name?"ref-row":""}>
                  <td>{g.name}{g.name===ref.name&&<span className="ref-tag">REF</span>}</td>
                  <td>{g.total.toLocaleString()}</td>
                  <td>{pct(g.selection_rate)}</td>
                  <td>{pct(g.tpr)}</td>
                  <td>{pct(g.precision)}</td>
                  <td>
                    {g.name===ref.name
                      ? <span className="flag-pass">1.000</span>
                      : <span className={g.disparate_impact_ratio>=0.8?"flag-pass":g.disparate_impact_ratio>=0.7?"flag-warn":"flag-fail"}>{g.disparate_impact_ratio.toFixed(3)}</span>
                    }
                  </td>
                  <td>
                    <span className={Math.abs(g.demographic_parity_diff)<=0.1?"flag-pass":Math.abs(g.demographic_parity_diff)<=0.15?"flag-warn":"flag-fail"}>
                      {g.demographic_parity_diff.toFixed(3)}
                    </span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card" style={{marginBottom:20}}>
        <div className="result-section-title">Recommended Controls</div>
        <div className="recs-list">
          {recs.map((r,i)=><div key={i} className="rec-item"><span className="rec-dot"/>{r}</div>)}
        </div>
      </div>

      <div className="card" style={{marginBottom:20}}>
        <div className="result-section-title">NIST AI RMF · Measure Function Mapping</div>
        <div className="nist-row">
          <div className="nist-card">
            <div className="nist-id">MEASURE 1.1</div>
            <div className="nist-text">Fairness metrics are defined and measured pre-deployment across all protected attribute groups. Results documented for audit.</div>
          </div>
          <div className="nist-card">
            <div className="nist-id">MEASURE 2.5</div>
            <div className="nist-text">Disparate impact, demographic parity, and equal opportunity metrics assessed and recorded in model card.</div>
          </div>
          <div className="nist-card">
            <div className="nist-id">MEASURE 2.6</div>
            <div className="nist-text">Bias evaluation conducted across gender, race, age, and other protected attributes relevant to the deployment context.</div>
          </div>
          <div className="nist-card">
            <div className="nist-id">MEASURE 4.1</div>
            <div className="nist-text">Fairness metrics should be re-evaluated post-deployment on a defined cadence to detect drift in bias patterns.</div>
          </div>
        </div>
      </div>

      <div className="btn-row">
        <button className="btn btn-download" onClick={()=>window.print()}>↓ Download Audit Report (PDF)</button>
        <button className="btn btn-secondary" onClick={onReset}>Run Another Audit</button>
      </div>
    </div>
  );
}

  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const [csvText, setCsvText] = useState("");
  const [csvHeaders, setCsvHeaders] = useState([]);
  const [attrCol, setAttrCol] = useState("");
  const [predCol, setPredCol] = useState("");
  const [outCol, setOutCol] = useState("");
  const [drag, setDrag] = useState(false);
  const [activeSample, setActiveSample] = useState(null);

  const loadSample = (key) => {
    setActiveSample(key);
    setError("");
    const s = SAMPLES[key];
    const r = computeFairness(s.groups, s.attribute);
    setResult(r);
    setMode("results");
  };

  const handleFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const text = e.target.result;
      setCsvText(text);
      const headers = text.split('\n')[0].split(',').map(h=>h.trim().replace(/"/g,''));
      setCsvHeaders(headers);
      setAttrCol(""); setPredCol(""); setOutCol("");
    };
    reader.readAsText(file);
  };

  const runAudit = () => {
    setError("");
    try {
      const groups = parseCSV(csvText, attrCol, predCol, outCol);
      const r = computeFairness(groups, attrCol);
      setResult(r);
      setMode("results");
    } catch(e) {
      setError(e.message);
    }
  };

  const reset = () => { setMode("input"); setResult(null); setError(""); setCsvText(""); setCsvHeaders([]); setAttrCol(""); setPredCol(""); setOutCol(""); setActiveSample(null); };

  const canRun = csvText && attrCol && predCol && outCol;

  return (
    <>
      <style>{css}</style>
      <div className="fat-root">
        <header className="fat-header">
          <div className="fat-logo">AI<span>/</span>Gov · Fairness Audit</div>
          <div className="fat-badge">PROTOTYPE v0.1</div>
        </header>

        <div className="fat-body">
          <div className="fat-title">Bias & Fairness Audit Tool</div>
          <div className="fat-subtitle">
            Pre-deployment fairness analysis for AI models. Computes Disparate Impact Ratio, Demographic Parity Difference, and Equal Opportunity Difference across protected attribute groups. Mapped to NIST AI RMF Measure function.
          </div>

          {mode === "input" && (
            <>
              <div className="demo-bar">
                <span className="demo-label">Quick Demo:</span>
                {Object.entries(SAMPLES).map(([key,s])=>(
                  <button key={key} className="demo-chip" onClick={()=>loadSample(key)}>{s.label}</button>
                ))}
              </div>

              <div className="card">
                <div className="sec-label">Upload Model Prediction Data (CSV)</div>
                <div
                  className={`upload-zone${drag?" drag":""}`}
                  onDragOver={e=>{e.preventDefault();setDrag(true);}}
                  onDragLeave={()=>setDrag(false)}
                  onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
                  onClick={()=>document.getElementById('csv-input').click()}
                >
                  <div className="upload-icon">📂</div>
                  <div className="upload-text">{csvText ? "✓ File loaded - configure columns below" : "Drop your CSV file here, or click to browse"}</div>
                  <div className="upload-sub">CSV must include: protected attribute column, binary prediction column (0/1), binary outcome column (0/1)</div>
                  <input id="csv-input" type="file" accept=".csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
                </div>

                {csvHeaders.length > 0 && (
                  <div className="col-grid">
                    <div className="field-group">
                      <label className="field-label">Protected Attribute Column</label>
                      <select className="field-input field-select" value={attrCol} onChange={e=>setAttrCol(e.target.value)}>
                        <option value="">Select column...</option>
                        {csvHeaders.map(h=><option key={h} value={h}>{h}</option>)}
                      </select>
                    </div>
                    <div className="field-group">
                      <label className="field-label">Model Prediction Column (0/1)</label>
                      <select className="field-input field-select" value={predCol} onChange={e=>setPredCol(e.target.value)}>
                        <option value="">Select column...</option>
                        {csvHeaders.map(h=><option key={h} value={h}>{h}</option>)}
                      </select>
                    </div>
                    <div className="field-group">
                      <label className="field-label">Actual Outcome Column (0/1)</label>
                      <select className="field-input field-select" value={outCol} onChange={e=>setOutCol(e.target.value)}>
                        <option value="">Select column...</option>
                        {csvHeaders.map(h=><option key={h} value={h}>{h}</option>)}
                      </select>
                    </div>
                  </div>
                )}

                <div className="btn-row">
                  <button className="btn btn-primary" onClick={runAudit} disabled={!canRun}>Run Fairness Audit</button>
                </div>
                {error && <div className="error-box">{error}</div>}
              </div>

              <div className="card">
                <div className="sec-label">Expected CSV Format</div>
                <div style={{fontFamily:'Space Mono,monospace',fontSize:12,color:'#64748b',lineHeight:1.8,background:'#080c14',padding:'16px',borderRadius:6}}>
                  gender,prediction,outcome<br/>
                  Male,1,1<br/>
                  Female,0,1<br/>
                  Male,1,0<br/>
                  Female,1,1<br/>
                  ...
                </div>
                <div style={{fontSize:12,color:'#475569',marginTop:12,lineHeight:1.6}}>
                  The tool computes per-group selection rates, true positive rates, and precision. The group with the highest selection rate is automatically set as the reference group. All other groups are compared against it.
                </div>
              </div>
            </>
          )}

          {mode === "results" && result && <Results result={result} onReset={reset} />}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
