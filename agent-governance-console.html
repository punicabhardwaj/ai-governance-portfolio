function ActionItem({ action, expanded, onToggle }) {
  return (
    <div className={`action-item${expanded ? " expanded" : ""}`} onClick={onToggle}>
      <div className="action-row">
        <span className="action-ts">{action.ts}</span>
        <span className="action-summary">
          {action.action}<span className="target">→ {action.target}</span>
        </span>
        <span className={`risk-pill risk-${action.risk}`}>{action.risk}</span>
        <span className={`outcome-pill outcome-${action.outcome.replace(/\s/g, "")}`}>{action.outcome}</span>
      </div>

      {expanded && (
        <div className="action-detail" onClick={e => e.stopPropagation()}>
          <div className="detail-rule">
            <div className="detail-rule-id">RULE {action.rule}</div>
            <div className="detail-rule-text">"{action.ruleText}"</div>
          </div>

          <div className="trace-section-label">Decision Trace</div>
          <div className="trace-list">
            {action.trace.map((t, i) => (
              <div key={i} className="trace-step">
                <div className={`trace-marker ${t.result}`}>
                  {t.result === "PASS" ? "✓" : t.result === "FAIL" || t.result === "BLOCKED" ? "✕" : "!"}
                </div>
                <div>
                  <div className="trace-check">{t.check} · {t.result}</div>
                  <div className="trace-detail">{t.detail}</div>
                </div>
              </div>
            ))}
          </div>

          {action.inputs && (
            <div className="detail-io">
              <strong>Inputs</strong>
              {action.inputs}
            </div>
          )}

          {action.output && (
            <div className="detail-io">
              <strong>Output</strong>
              {action.output}
            </div>
          )}

          {action.remediation && (
            <div className="detail-remediation">
              <strong>Remediation</strong>
              {action.remediation}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function AgentDetailModal({ agent, onClose, onPause, onKill }) {
  const [expandedAction, setExpandedAction] = useState(0);

  if (!agent) return null;

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-panel" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title-block">
            <div className="modal-id">{agent.id} · {agent.autonomyLevel}</div>
            <div className="modal-title">{agent.name}</div>
            <div className="modal-pills">
              <span className={`status-pill status-${agent.status}`}>{agent.status}</span>
              <span className={`risk-pill risk-${agent.riskTier}`}>{agent.riskTier} Risk</span>
            </div>
          </div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>

        <div className="modal-body">

          <div className="modal-section">
            <div className="modal-section-title">Purpose</div>
            <div className="modal-text">{agent.purpose}</div>
          </div>

          <div className="modal-section">
            <div className="modal-section-title">Accountability</div>
            <div className="modal-meta-grid">
              <div className="modal-meta-item"><strong>Owner</strong>{agent.owner}</div>
              <div className="modal-meta-item"><strong>Contact</strong>{agent.ownerEmail}</div>
              <div className="modal-meta-item"><strong>Deployed</strong>{agent.deployedSince}</div>
              <div className="modal-meta-item"><strong>Model</strong>{agent.model}</div>
            </div>
          </div>

          <div className="modal-section">
            <div className="modal-section-title">Permission Scope</div>
            <div className="perms-row">
              <span className="perm-label">Allowed</span>
              {agent.permissions.map(p => <span key={p} className="perm-chip perm-allow">{p}</span>)}
            </div>
            <div className="perms-row">
              <span className="perm-label">Blocked</span>
              {agent.blocked.map(p => <span key={p} className="perm-chip perm-block">{p}</span>)}
            </div>
            {agent.requiresApproval.length > 0 && (
              <div className="perms-row">
                <span className="perm-label">Approval</span>
                {agent.requiresApproval.map(p => <span key={p} className="perm-chip perm-approve">{p}</span>)}
              </div>
            )}
          </div>

          <div className="modal-section">
            <div className="modal-section-title">Recent Actions · Click to expand decision trace</div>
            {agent.actions.map((a, i) => (
              <ActionItem
                key={i}
                action={a}
                expanded={expandedAction === i}
                onToggle={() => setExpandedAction(expandedAction === i ? -1 : i)}
              />
            ))}
          </div>

          <div className="modal-section">
            <div className="modal-section-title">Runtime Controls</div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {agent.status !== "Killed" ? (
                <>
                  <button className="btn-mini" onClick={() => { onPause(agent.id); onClose(); }}>
                    {agent.status === "Active" ? "Pause Agent" : "Resume Agent"}
                  </button>
                  <button className="btn-mini danger" onClick={() => { onKill(agent.id); onClose(); }}>
                    Kill Agent
                  </button>
                </>
              ) : (
                <div style={{ fontSize: 12, color: '#fca5a5' }}>Agent has been killed. Re-deployment requires owner approval.</div>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function AgentGovernanceConsole() {
  const [tab, setTab] = useState("registry");
  const [agents, setAgents] = useState(initialAgents);
  const [selectedAgent, setSelectedAgent] = useState(null);
  const [selectedIncident, setSelectedIncident] = useState(null);

  const totalAgents = agents.length;
  const activeAgents = agents.filter(a => a.status === "Active").length;

  const allActions = agents.flatMap(a => a.actions || []);
  const blockedCount = allActions.filter(a => a.outcome === "Blocked").length;
  const pendingCount = allActions.filter(a => a.outcome === "Pending Approval").length + incidents.filter(i => i.status === "Under Review").length;

  const toggleStatus = (id) => {
    setAgents(agents.map(a => a.id === id ? { ...a, status: a.status === "Active" ? "Paused" : "Active" } : a));
  };

  const killAgent = (id) => {
    setAgents(agents.map(a => a.id === id ? { ...a, status: "Killed" } : a));
  };

  // Keep selected agent in sync with state changes
  const liveSelectedAgent = selectedAgent ? agents.find(a => a.id === selectedAgent.id) : null;

  return (
    <>
      <style>{styles}</style>
      <div className="acg-root">
        <header className="acg-header">
          <div className="acg-logo">AI<span>/</span>Gov · Agent Console</div>
          <div className="acg-badge">PROTOTYPE v0.2</div>
          <div className="acg-status-dot" />
          <div className="acg-live">LIVE</div>
        </header>

        <div className="acg-metrics">
          <div className="metric-card">
            <div className="metric-label">Registered Agents</div>
            <div className="metric-value">{totalAgents}</div>
            <div className="metric-sub">{activeAgents} active</div>
          </div>
          <div className="metric-card">
            <div className="metric-label">Actions (24h)</div>
            <div className="metric-value">{allActions.length * 32}</div>
            <div className="metric-sub">across all agents</div>
          </div>
          <div className="metric-card">
            <div className="metric-label">Blocked</div>
            <div className="metric-value warn">{blockedCount * 5}</div>
            <div className="metric-sub">prevented by guardrails</div>
          </div>
          <div className="metric-card">
            <div className="metric-label">Pending Review</div>
            <div className="metric-value danger">{pendingCount}</div>
            <div className="metric-sub">requires human approval</div>
          </div>
        </div>

        <div className="acg-tabs">
          <button className={`tab-btn${tab === "registry" ? " active" : ""}`} onClick={() => setTab("registry")}>
            Agent Registry <span className="tab-count">{agents.length}</span>
          </button>
          <button className={`tab-btn${tab === "incidents" ? " active" : ""}`} onClick={() => setTab("incidents")}>
            Incidents <span className="tab-count">{incidents.length}</span>
          </button>
          <button className={`tab-btn${tab === "compliance" ? " active" : ""}`} onClick={() => setTab("compliance")}>
            Compliance
          </button>
        </div>

        <div className="acg-body">
          {tab === "registry" && (
            <>
              <div className="section-head">
                <div>
                  <div className="section-title">Agent Registry</div>
                  <div className="section-sub">Click any agent to drill into permissions, recent actions, and the decision trace for every allow / block decision.</div>
                </div>
              </div>
              <div className="agent-grid">
                {agents.map(a => (
                  <div key={a.id} className="agent-card" onClick={() => setSelectedAgent(a)}>
                    <div>
                      <div className="agent-id">{a.id} · {a.autonomyLevel}</div>
                      <div className="agent-name">{a.name}</div>
                      <div className="agent-purpose">{a.purpose}</div>
                      <div className="agent-meta">
                        <span><strong>Owner:</strong> {a.owner}</span>
                        <span><strong>Last activity:</strong> {a.lastActivity}</span>
                        <span><strong>Today:</strong> {a.actionsToday} actions · {a.flaggedToday} flagged</span>
                      </div>
                      <div className="perms-row">
                        <span className="perm-label">Allowed</span>
                        {a.permissions.slice(0, 3).map(p => <span key={p} className="perm-chip perm-allow">{p}</span>)}
                      </div>
                      <div className="perms-row">
                        <span className="perm-label">Blocked</span>
                        {a.blocked.slice(0, 3).map(p => <span key={p} className="perm-chip perm-block">{p}</span>)}
                      </div>
                      <div className="click-hint">→ Click for full decision trace</div>
                    </div>

                    <div className="agent-side">
                      <span className={`status-pill status-${a.status}`}>{a.status}</span>
                      <span className={`risk-pill risk-${a.riskTier}`}>{a.riskTier} Risk</span>
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}

          {tab === "incidents" && (
            <>
              <div className="section-head">
                <div>
                  <div className="section-title">Incidents</div>
                  <div className="section-sub">Click any incident to see the full timeline and resolution path.</div>
                </div>
              </div>
              {incidents.map(inc => (
                <div key={inc.id} className={`incident-card severity-${inc.severity}`} onClick={() => setSelectedIncident(inc)}>
                  <div className="incident-head">
                    <span className="incident-id">{inc.id} · {inc.severity}</span>
                    <span className={`status-pill status-${inc.status === "Under Review" ? "Paused" : "Active"}`}>
                      {inc.status}
                    </span>
                  </div>
                  <div className="incident-title">{inc.title}</div>
                  <div className="incident-detail">{inc.detail}</div>
                  <div className="incident-meta">
                    <span><strong>Agent:</strong> {inc.agentName}</span>
                    <span><strong>Opened:</strong> {inc.opened}</span>
                    <span><strong>Framework:</strong> {inc.framework}</span>
                  </div>
                </div>
              ))}
            </>
          )}

          {tab === "compliance" && (
            <>
              <div className="section-head">
                <div>
                  <div className="section-title">Framework Compliance</div>
                  <div className="section-sub">Mapping of platform controls to the Singapore Model AI Governance Framework for Agentic AI (Jan 2026) and the NIST AI RMF Manage function.</div>
                </div>
              </div>

              <div className="framework-grid">
                <div className="framework-block">
                  <div className="framework-block-title">Singapore Agentic AI Framework</div>
                  <div className="framework-dim">
                    <div className="framework-dim-name">1. Risk Assessment</div>
                    <div className="framework-dim-desc">Use-case-specific evaluations considering autonomy level, data access scope, and action authority.</div>
                    <div className="framework-status"><span className="framework-status-dot" />Implemented · Risk tier per agent</div>
                  </div>
                  <div className="framework-dim">
                    <div className="framework-dim-name">2. Human Accountability</div>
                    <div className="framework-dim-desc">Clear ownership and responsibility chains for agent behaviors.</div>
                    <div className="framework-status"><span className="framework-status-dot" />Implemented · Owner + contact per agent</div>
                  </div>
                  <div className="framework-dim">
                    <div className="framework-dim-name">3. Technical Controls</div>
                    <div className="framework-dim-desc">Kill switches, purpose binding, and behavior monitoring.</div>
                    <div className="framework-status"><span className="framework-status-dot" />Implemented · Kill switch + permission scoping + audit log</div>
                  </div>
                  <div className="framework-dim">
                    <div className="framework-dim-name">4. End-User Responsibility</div>
                    <div className="framework-dim-desc">Guidelines for users interacting with autonomous agents.</div>
                    <div className="framework-status"><span className="framework-status-dot" />Documented · Stated purpose per agent</div>
                  </div>
                </div>

                <div className="framework-block">
                  <div className="framework-block-title">NIST AI RMF · Manage</div>
                  <div className="framework-dim">
                    <div className="framework-dim-name">MANAGE 1.1 - Action prioritization</div>
                    <div className="framework-dim-desc">Higher-risk agent actions are prioritized for review and require human approval before execution.</div>
                    <div className="framework-status"><span className="framework-status-dot" />Implemented · Approval workflow</div>
                  </div>
                  <div className="framework-dim">
                    <div className="framework-dim-name">MANAGE 2.4 - Response and recovery</div>
                    <div className="framework-dim-desc">Pause and kill mechanisms available for any registered agent at runtime.</div>
                    <div className="framework-status"><span className="framework-status-dot" />Implemented · One-click controls</div>
                  </div>
                  <div className="framework-dim">
                    <div className="framework-dim-name">MANAGE 4.1 - Post-deployment monitoring</div>
                    <div className="framework-dim-desc">Continuous logging and monitoring of agent actions, with anomaly detection driving incident creation.</div>
                    <div className="framework-status"><span className="framework-status-dot" />Implemented · Action log + incidents</div>
                  </div>
                  <div className="framework-dim">
                    <div className="framework-dim-name">MANAGE 4.3 - Incident response</div>
                    <div className="framework-dim-desc">Defined incident lifecycle from detection through review and resolution.</div>
                    <div className="framework-status"><span className="framework-status-dot" />Implemented · Incident register</div>
                  </div>
                </div>
              </div>
            </>
          )}
        </div>

        {liveSelectedAgent && (
          <AgentDetailModal
            agent={liveSelectedAgent}
            onClose={() => setSelectedAgent(null)}
            onPause={toggleStatus}
            onKill={killAgent}
          />
        )}

        {selectedIncident && (
          <IncidentDetailModal
            incident={selectedIncident}
            onClose={() => setSelectedIncident(null)}
          />
        )}
      </div>
    </>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(AgentGovernanceConsole));
  </script>
</body>
</html>
